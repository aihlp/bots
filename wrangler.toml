name = "bot"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/admin"
binding = "__STATIC_CONTENT"

[vars]
ENVIRONMENT = "production"

# IMPORTANT: Do NOT add kv_namespaces block here!
# Bindings configured in wrangler.toml will OVERWRITE all Dashboard bindings.
# Configure KV namespaces ONLY in the Cloudflare Dashboard UI.
